name: CD — Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          cache: true

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Build Flutter web
        run: flutter build web --release

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore --project rolekeeper-7ddcc

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project rolekeeper-7ddcc

      - name: Deploy Functions
        run: firebase deploy --only functions --project rolekeeper-7ddcc

      - name: Deploy Flutter web to Hosting
        run: firebase deploy --only hosting --project rolekeeper-7ddcc
