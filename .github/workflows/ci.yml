name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.38.2 /home/runner/flutter
          /home/runner/flutter/bin/flutter --version

      - name: Setup Java (for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Flutter dependencies
        run: /home/runner/flutter/bin/flutter pub get

      - name: Flutter analyze
        run: /home/runner/flutter/bin/flutter analyze --no-pub

      - name: Functions ESLint
        run: npx eslint src/ --max-warnings 0
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Flutter tests
        run: /home/runner/flutter/bin/flutter test --no-pub

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Functions tests (with emulators)
        run: |
          # Firestore rules harness: lib/security/firestoreRules.test.js (Task 006)
          firebase emulators:exec \
            --only auth,functions,firestore,storage \
            --project rolekeeper-7ddcc \
            "cd functions && GOOGLE_APPLICATION_CREDENTIALS= FIRESTORE_EMULATOR_HOST=localhost:8080 FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 FIREBASE_STORAGE_EMULATOR_HOST=localhost:9199 node --test lib/security/firestoreRules.test.js lib/"
