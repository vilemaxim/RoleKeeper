name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          cache: true

      - name: Setup Java (for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-pub --no-fatal-warnings

      - name: Functions ESLint
        run: npx eslint src/ --max-warnings 0
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Flutter tests
        run: flutter test --no-pub

      - name: Functions tests (with emulators)
        run: |
          firebase emulators:exec \
            --only auth,functions,firestore,storage \
            --project rolekeeper-7ddcc \
            "cd functions && FIRESTORE_EMULATOR_HOST=localhost:8080 FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 node --test lib/"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
